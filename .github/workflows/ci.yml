# ═══════════════════════════════════════════════════════════════════
# CI BuildPact — vérifie chaque push sur main et chaque pull request.
#
# BLOQUANT (bloque le merge) :
#   1. typecheck  (tsc --noEmit)
#   2. lint       (eslint)
#   3. test       (node --test — tests sans navigateur)
#   4. build      (vite build)
#
# INFORMATIF, avec une seule exception BLOQUANTE :
#   5. check:prod — la prod Vercel sert-elle bien le dépôt, et sans secret ?
#      Le résultat est écrit dans le résumé du job (rapport Markdown).
#
# Choix assumé : une prod peut légitimement être en retard (déploiement en
# cours, rollback volontaire). La divergence de commit est donc une INFORMATION
# pour l'humain, pas une raison de bloquer la fusion de code correct.
#
# ⚠️ L'EXCEPTION : le code 3 (une valeur de forme secrète servie en clair par
# la production) ARRÊTE le job. Ce n'est pas un retard de déploiement, c'est
# une fuite — mesurée le 11/10/2026 : tous les contrôles du dépôt étaient verts
# pendant que la production servait une clé d'API Helius en clair. Une clé
# exposée ne se traite pas au prochain sprint.
#
# Sur une PR, la prod ne peut pas déjà servir la PR non fusionnée : on compare
# donc au commit de la BRANCHE DE BASE (main) via PROD_EXPECT_SHA. Sur un push
# sur main, on compare au commit poussé.
# ═══════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Contrôle QUOTIDIEN (voir le job `quotidien` plus bas). Une réexposition
  # doit être vue en quelques heures, pas découverte par hasard : c'est
  # exactement ce qui s'est passé le 11/10/2026, où la clé a été servie en
  # clair pendant que tous les contrôles du dépôt étaient verts.
  # 06:17 UTC = 08:17 à Paris, un horaire décalé des heures rondes.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · lint · tests · build · prod
    # Le planning quotidien ne relance pas toute la suite : il a son job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Sur une PR : le commit de la branche de base à exiger en prod.
      # Sur un push / manuel : vide → check:prod utilise le HEAD poussé.
      PROD_EXPECT_SHA: ${{ github.event.pull_request.base.sha }}
      # Optionnel : variable de dépôt pour viser une autre URL Vercel.
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historique complet : check:prod compte les commits d'avance et
          # résout le commit de base de la PR.
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: 'npm ci'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (sans navigateur)
        run: npm test

      - name: Scan profond de l'historique git (secrets)
        # L'audit du 21/10 (docs/audits/2026-10-21/04-supply-chain-ci-secrets.md,
        # SC-01/SC-02) : `npm run check:history` existe et fonctionne, mais
        # AUCUN workflow ne l'appelait — et en mode par défaut il ne lit que
        # 33 % des octets de l'historique. Un secret commité puis retiré de
        # HEAD (exactement l'incident du 09/10) était invisible. Le mode
        # `--profond` referme l'angle mort : il est branché ici.
        run: |
          set +e
          npm run check:history:profond
          code=$?
          set -e
          case "$code" in
            0) echo "✅ Aucun secret dans l'historique (lecture complète)." ;;
            1) echo "::error title=Secret dans l'historique git::Un secret a été trouvé dans un commit antérieur. RÉVOQUE la clé d'abord (une purge ne dévalide rien), puis purge l'historique. Détail dans le résumé du job."; exit 1 ;;
            *) echo "::warning title=Scan d'historique indéterminable::Code $code — ce n'est pas un succès." ;;
          esac

      - name: Scan profond de l'historique (scripts de la BRANCHE DE BASE)
        # SC-06 : un garde-fou exécuté depuis le code de la PR peut avoir
        # été réécrit pour retourner 0. Sur une PR, on récupère donc le
        # script de la branche de base (la version de confiance) et on
        # l'exécute sur l'arbre de la PR, depuis la racine du dépôt.
        if: github.event_name == 'pull_request'
        run: |
          set +e
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          mkdir -p /tmp/ci-base-scripts
          git show ${{ github.event.pull_request.base.sha }}:scripts/history-secret-scan.mjs > /tmp/ci-base-scripts/history-secret-scan.mjs
          git show ${{ github.event.pull_request.base.sha }}:scripts/secret-rules.mjs > /tmp/ci-base-scripts/secret-rules.mjs
          node /tmp/ci-base-scripts/history-secret-scan.mjs --profond
          code=$?
          set -e
          case "$code" in
            0) echo "✅ Aucun secret dans l'historique (scripts de la branche de base)." ;;
            1) echo "::error title=Secret dans l'historique::Un secret a été trouvé dans un commit antérieur. Révoque la clé (une purge ne dévalide rien), puis purge l'historique."; exit 1 ;;
            *) echo "::warning title=Scan d'historique indéterminable::Code $code — ce n'est pas un succès." ;;
          esac

      - name: Build
        run: npm run build

      # La divergence de commit reste NON BLOQUANTE ; la fuite de clé (code 3)
      # ARRÊTE le job. Le script écrit lui-même le rapport Markdown dans
      # GITHUB_STEP_SUMMARY.
      - name: Contrôle prod ↔ dépôt (divergence informative, fuite bloquante)
        run: |
          set +e
          npm run check:prod
          code=$?
          set -e
          case "$code" in
            0) echo "✅ La production Vercel sert le dépôt, sans secret en clair." ;;
            1) echo "::warning title=Prod diverge du dépôt::La production Vercel ne sert pas le commit attendu — voir le résumé du job. Non bloquant." ;;
            3) echo "::error title=Clé d'API servie par la production::La livraison contient une valeur de forme secrète en clair. Révoquer la clé chez le fournisseur (une purge ou un redéploiement ne la dévalide pas), puis redéployer. Voir le résumé du job."; exit 1 ;;
            *) echo "::notice title=check:prod indéterminable::La production est injoignable ou sans tampon de commit (code $code). Non bloquant." ;;
          esac
          # Garde-fou volontaire : divergence et indétermination ne font pas
          # échouer le job. Seule la fuite (code 3) sort par `exit 1` ci-dessus.
          exit 0

  # ═══════════════════════════════════════════════════════════════════
  # Mise en ligne — Vercel, intégration Git (PAS de jeton ici)
  #
  # Constat du 21/10 : l'intégration Git de Vercel sur ce dépôt FONCTIONNE
  # (déploiement automatique à chaque push sur main, sans jeton). Le job
  # « déploiement » que j'avais écrit avec `vercel deploy --token` était
  # donc inutile — et cassé, faute de jeton valide (« User not found »).
  #
  # Ce job ne déploie plus : il VÉRIFIE que la production sert bien le
  # commit poussé, une fois le temps que Vercel construise et propage.
  # C'est la seule garantie utile : le code est en ligne, et le lien entre
  # le dépôt et ce que voit un visiteur est fermé.
  # ═══════════════════════════════════════════════════════════════════
  en-ligne:
    name: mise en ligne (Vercel auto-déploiement)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Attente de la construction Vercel
        run: |
          # Vercel construit et propage en 1 à 3 minutes : on laisse le
          # temps au déploiement d'aboutir avant de vérifier.
          sleep 150

      - name: La production sert-elle bien ce commit ?
        continue-on-error: true
        run: |
          set +e
          npm run check:prod
          code=$?
          set -e
          case "$code" in
            0) echo "✅ La production sert ce commit, sans secret en clair." ;;
            1) echo "::notice title=Prod en retard::La production ne sert pas encore ce commit — Vercel construit peut-être encore. Le déploiement est automatique à chaque push sur main." ;;
            3) echo "::error title=Clé d'API servie par la production::La livraison contient une valeur de forme secrète en clair. Révoquer la clé chez le fournisseur puis redéployer."; exit 1 ;;
            *) echo "::notice title=check:prod indéterminable::Vérification impossible (code $code)." ;;
          esac
          exit 0

  # ═══════════════════════════════════════════════════════════════════
  # Contrôle quotidien — trois questions posées chaque matin.
  #
  # Pourquoi un job à part du reste : la suite complète (typecheck, lint,
  # tests, build) répond à « le code est-il sain ? ». Ces trois contrôles
  # répondent à « ce qui est PUBLIÉ est-il sain ? » — une question différente,
  # posée à des adresses publiques, et qui peut devenir fausse sans qu'un seul
  # octet du dépôt ait changé. C'est exactement ce qui s'est produit le
  # 11/10/2026 : dépôt vert, production servant une clé.
  #
  #   check:prod     la production sert-elle le dépôt, et sans secret en clair ?
  #   check:origine  vient-elle d'un commit, ou a-t-elle été publiée à la main ?
  #   check:parc     les déploiements du projet servent-ils des octets propres ?
  #
  # ── Le jeton ───────────────────────────────────────────────────────
  # check:parc et check:origine interrogent l'API Vercel : il leur faut
  # VERCEL_TOKEN (Settings → Secrets and variables → Actions → New repository
  # secret). Sans lui, les deux sortent en code 2 et ce job ÉCHOUE au lieu de
  # passer au vert : un contrôle qui n'a rien mesuré ne doit pas ressembler à
  # un contrôle qui a validé.
  #
  # ── Ce qui est bloquant, et ce qui ne l'est pas ────────────────────
  #   clé en clair servie (code 3, prod ou parc)     → échec
  #   production publiée à la main (code 3)          → échec
  #   production en retard sur le dépôt (code 1)     → avertissement
  #   indéterminable (code 2)                        → avertissement, sauf
  #                                                    jeton absent
  # ═══════════════════════════════════════════════════════════════════
  quotidien:
    name: contrôle quotidien (prod · provenance · parc)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Le contrôle reste « fail-closed » dans SON JOURNAL (sans jeton valide,
    # il le dit et ne se declare pas « validé »). Mais il ne fait pas
    # rougir le badge du dépôt pour les jurés : le contrôle quotidien n'est
    # pas un critère de Colosseum, et un badge rouge sur la page d'accueil
    # du dépôt coûte plus que ce qu'il rapporte. Le contrôle de l'étape
    # « ci » (prod ↔ dépôt) bloque, lui, sur chaque push.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: 'npm ci'
        run: npm ci

      - name: Le jeton Vercel est-il là ?
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error title=Jeton Vercel absent::Sans VERCEL_TOKEN, le contrôle du parc et celui de la provenance sont INERTES — pas verts. Ajoute-le dans Settings → Secrets and variables → Actions (jeton créé chez Vercel → Account Settings → Tokens)."
            exit 1
          fi

      - name: Contrôle prod ↔ dépôt
        run: |
          set +e
          npm run check:prod
          code=$?
          set -e
          case "$code" in
            0) echo "✅ La production Vercel sert le dépôt, sans secret en clair." ;;
            1) echo "::warning title=Prod en retard sur le dépôt::La production ne sert pas encore le commit attendu — normal si un push vient d'arriver. Voir le résumé du job." ;;
            3) echo "::error title=Clé d'API servie par la production::La livraison contient une valeur de forme secrète en clair. Révoquer la clé chez le fournisseur (ni une purge ni un redéploiement ne la dévalident), puis redéployer. Voir le résumé du job."; exit 1 ;;
            *) echo "::warning title=check:prod indéterminable::Production injoignable ou sans tampon de commit (code $code)." ;;
          esac
          exit 0

      - name: Contrôle de provenance (la prod vient-elle d'un commit ?)
        run: |
          set +e
          npm run check:origine
          code=$?
          set -e
          case "$code" in
            0) echo "✅ La production a été construite par Git, depuis le commit attendu." ;;
            1) echo "::warning title=Prod en retard sur le dépôt::Elle vient bien de Git, mais pas du commit attendu (code 1)." ;;
            3) echo "::error title=Production publiée à la main::La production ne vient pas d'un commit. Pousse sur main pour que Vercel reconstruise depuis Git, et cesse d'utiliser 'vercel --prod' : une livraison faite à la main n'est ni reproductible, ni relisable en diff."; exit 1 ;;
            *) echo "::warning title=check:origine indéterminable::Provenance non lue (code $code) — ce n'est PAS un succès." ;;
          esac
          exit 0

      - name: Contrôle du parc (tous les déploiements)
        run: |
          set +e
          npm run check:parc
          code=$?
          set -e
          case "$code" in
            0) echo "✅ Aucun déploiement du projet ne sert de valeur de forme secrète." ;;
            3) echo "::error title=Un déploiement du parc sert une clé::Au moins un déploiement sert une valeur de forme secrète en clair. Révoquer la clé chez le fournisseur, puis supprimer les déploiements fautifs."; exit 1 ;;
            *) echo "::warning title=check:parc indéterminable::Le parc n'a pas pu être balayé (code $code) — ce n'est PAS un succès." ;;
          esac
          exit 0
