@layer base {
  * {
    @apply border-border;
  }

  
  body {
    background-color: rgb(var(--canvas-900-rgb));
    color: rgb(var(--text-primary-rgb));
    font-family: 'Space Grotesk', sans-serif;
  }
}

@layer components {
  
  .glass-panel {
    background-color: rgb(var(--surface-1-rgb) / 0.05);
    
    border: 1px solid rgb(var(--text-primary-rgb) / 0.07);
    border-radius: 1rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  
  .modal-surface {
    background-color: rgb(var(--canvas-800-rgb) / 1);
    border: 1px solid rgb(var(--text-primary-rgb) / 0.09);
    border-radius: 1rem;
  }

  
  .surface-2 {
    background-color: rgb(var(--surface-2-rgb) / 0.08);
  }

  .surface-3 {
    background-color: rgb(var(--surface-3-rgb) / 0.12);
  }

  
  .glass-panel-hover {
    transition:
      border-color 200ms cubic-bezier(0.4, 0, 0.2, 1),
      background-color 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .glass-panel-hover:hover {
    border-color: rgb(var(--accent-violet-rgb) / 0.35);
    background-color: rgb(var(--text-primary-rgb) / 0.06);
  }

  
  .btn-primary {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 2.75rem;
    padding: 0 1.25rem;
    border-radius: 0.75rem;
    background-image: linear-gradient(
      135deg,
      rgb(var(--accent-violet-rgb)) 0%,
      var(--accent-primary-deep) 100%
    );
    color: #ffffff;
    font-size: 0.875rem;
    font-weight: 700;
    box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.12) inset;
    transition:
      box-shadow 220ms cubic-bezier(0.4, 0, 0.2, 1),
      transform 220ms cubic-bezier(0.4, 0, 0.2, 1),
      filter 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.08);
    box-shadow:
      0 1px 0 0 rgba(255, 255, 255, 0.18) inset,
      0 8px 24px -6px rgb(var(--accent-violet-rgb) / calc(0.55 * var(--glow-strength)));
  }

  .btn-primary:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  
  .btn-neon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 2.75rem;
    padding: 0 1.25rem;
    border-radius: 0.75rem;
    background-image: linear-gradient(
      135deg,
      rgb(var(--accent-neon-rgb)) 0%,
      var(--accent-money-deep) 100%
    );
    
    color: #04140d;
    font-size: 0.875rem;
    font-weight: 700;
    box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.25) inset;
    transition:
      box-shadow 220ms cubic-bezier(0.4, 0, 0.2, 1),
      transform 220ms cubic-bezier(0.4, 0, 0.2, 1),
      filter 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn-neon:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.06);
    box-shadow:
      0 1px 0 0 rgba(255, 255, 255, 0.3) inset,
      0 8px 24px -6px rgb(var(--accent-neon-rgb) / calc(0.5 * var(--glow-strength)));
  }

  .btn-neon:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-neon:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  
  .card-lift {
    transition:
      transform 260ms cubic-bezier(0.4, 0, 0.2, 1),
      border-color 260ms cubic-bezier(0.4, 0, 0.2, 1),
      box-shadow 260ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-lift:hover {
    transform: translateY(-3px);
    border-color: rgb(var(--accent-violet-rgb) / 0.32);
    box-shadow:
      0 18px 44px -18px rgb(var(--accent-violet-rgb) / calc(0.5 * var(--glow-strength))),
      0 0 0 1px rgb(var(--accent-violet-rgb) / 0.08);
  }

  
  .skeleton {
    background: linear-gradient(
      90deg,
      rgb(var(--text-primary-rgb) / 0.04) 25%,
      rgb(var(--text-primary-rgb) / 0.08) 37%,
      rgb(var(--text-primary-rgb) / 0.04) 63%
    );
    background-size: 400% 100%;
    border-radius: 0.75rem;
    animation: skeleton-sweep 1.4s ease-in-out infinite;
  }

  
  .grid-bg {
    background-image:
      linear-gradient(rgb(var(--accent-violet-rgb) / 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgb(var(--accent-violet-rgb) / 0.06) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  }

  
  [data-mode='light'] .grid-bg {
    background-image: none;
  }

  
  .bg-aurora-sweep {
    position: absolute;
    inset: -20% -20%;
    background: linear-gradient(
      115deg,
      transparent 30%,
      rgb(var(--accent-violet-rgb) / 0.22) 45%,
      rgb(var(--accent-neon-rgb) / 0.16) 55%,
      transparent 70%
    );
    background-size: 200% 200%;
    animation: aurora-drift 36s ease-in-out infinite;
  }

  @keyframes aurora-drift {
    0%,
    100% {
      background-position: 0% 20%;
    }
    50% {
      background-position: 100% 80%;
    }
  }

  
  .bg-scanlines {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      rgb(var(--accent-violet-rgb) / 0.05) 0px,
      rgb(var(--accent-violet-rgb) / 0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    animation: scanline-drift 9s linear infinite;
  }

  @keyframes scanline-drift {
    0% {
      background-position: 0 0;
    }
    100% {
      background-position: 0 120px;
    }
  }
}

@keyframes skeleton-sweep {
  0% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0 50%;
  }
}




@keyframes quest-burst {
  0% {
    opacity: 1;
    transform: rotate(var(--burst-angle, 0deg)) translateY(0) scale(0.6);
  }
  100% {
    opacity: 0;
    transform: rotate(var(--burst-angle, 0deg)) translateY(-26px) scale(1.4);
  }
}

.quest-burst-particle {
  animation: quest-burst 650ms ease-out forwards;
}


@keyframes quest-ring-pulse {
  0% {
    box-shadow: 0 0 0 0 rgb(var(--accent-gold-rgb) / 0.45);
  }
  70% {
    box-shadow: 0 0 0 8px rgb(var(--accent-gold-rgb) / 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgb(var(--accent-gold-rgb) / 0);
  }
}

.quest-badge-claimable {
  animation: quest-ring-pulse 2200ms ease-out infinite;
}


@keyframes quest-row-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.quest-row-enter {
  animation: quest-row-in 320ms ease-out both;
  animation-delay: var(--row-delay, 0ms);
}


@keyframes quest-unlock-flash {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgb(var(--accent-gold-rgb) / 0);
  }
  35% {
    transform: scale(1.35);
    box-shadow: 0 0 16px 4px rgb(var(--accent-gold-rgb) / 0.7);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgb(var(--accent-gold-rgb) / 0);
  }
}

.quest-badge-unlock {
  animation: quest-unlock-flash 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}


@keyframes xpbar-shimmer-sweep {
  0% {
    transform: translateX(0%) skewX(-20deg);
  }
  100% {
    transform: translateX(400%) skewX(-20deg);
  }
}

.xpbar-shimmer {
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.55),
    transparent
  );
  animation: xpbar-shimmer-sweep 2600ms ease-in-out infinite;
}


@keyframes xpbar-levelup-flash {
  0% {
    transform: scale(1);
    text-shadow: 0 0 0 rgb(var(--accent-gold-rgb) / 0);
  }
  30% {
    transform: scale(1.25);
    text-shadow: 0 0 12px rgb(var(--accent-gold-rgb) / 0.9);
  }
  100% {
    transform: scale(1);
    text-shadow: 0 0 0 rgb(var(--accent-gold-rgb) / 0);
  }
}

.xpbar-levelup-flash {
  animation: xpbar-levelup-flash 900ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}


@keyframes page-transition-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.page-transition-in {
  animation: page-transition-in 260ms ease-out both;
}


@media (prefers-reduced-motion: reduce) {
  .skeleton,
  .animate-float,
  .bg-aurora-sweep,
  .bg-scanlines {
    animation: none;
  }

  
  .quest-burst-particle {
    display: none;
  }

  
  .quest-badge-claimable {
    animation: none;
  }

  
  .quest-row-enter {
    animation: none;
  }

  .quest-badge-unlock {
    animation: none;
  }

  .page-transition-in {
    animation: none;
  }

  
  .xpbar-shimmer {
    display: none;
  }

  .xpbar-levelup-flash {
    animation: none;
  }

  
  .card-lift:hover,
  .btn-primary:hover:not(:disabled),
  .btn-neon:hover:not(:disabled) {
    transform: none;
  }
}


.wallet-adapter-button-trigger {
  color: #ffffff !important;
}
